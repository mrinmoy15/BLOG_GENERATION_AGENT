services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/${APP_NAME}-backend:${APP_VERSION}
    container_name: ${CONTAINER_NAME}-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/${APP_NAME}-frontend:${APP_VERSION}
    container_name: ${CONTAINER_NAME}-frontend
    ports:
      - "5173:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
